<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#05060c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Office Mini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div class="vignette"></div>

  <header class="topbar glass">
    <div class="brand">
      <button class="icon-btn" id="peopleBtn"></button>
      <div class="logo" id="logo"></div>
      <div style="min-width:0"><h1 id="company">Office Mini</h1><p id="stats"></p></div>
    </div>
    <div class="actions">
      <div class="quota" id="quota" hidden></div>
      <button class="icon-btn bell" id="bellBtn"><span class="badge" id="bellBadge" hidden></span></button>
      <button class="icon-btn" id="modeBtn"></button>
      <button class="icon-btn" id="langBtn"><span class="lang-glyph">ع</span></button>
      <button class="icon-btn" id="settingsBtn"></button>
    </div>
  </header>
  <div class="seg-wrap"><nav class="seg glass" id="viewSeg"></nav></div>
  <div class="alerts" id="alerts"></div>
  <aside class="people glass" id="people"></aside>
  <div class="viewctl glass" id="viewctl"></div>

  <section class="view" id="view-org"></section>
  <section class="view" id="view-work"></section>
  <section class="view" id="view-workflows"></section>
  <section class="view" id="view-settings"></section>

  <div class="legend glass" id="legend"></div>
  <button class="fab" id="fab"></button>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer glass" id="drawer" aria-modal="true" role="dialog"><div class="handle"></div><div id="drawerBody" style="display:contents"></div></aside>
  <div class="popover glass" id="popover" role="dialog"></div>
  <div class="modal" id="modal"><div class="sheet glass" id="modalSheet"></div></div>
  <div class="toasts" id="toasts"></div>
  <div class="loader" id="loader"><div class="mark" id="loaderMark"></div></div>

  <svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="qgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a497ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
  </defs></svg>
  <script type="module" src="js/main.js"></script>
</body>
</html>
